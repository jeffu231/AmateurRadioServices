################################################################################
# Amateur Radio Services
################################################################################
# docker-compose -f docker-compose.yml -p amateur-radio-services up
# Requires environment for the QRZ credentials and aprs.fi api
################################################################################
services:
  amateur-radio-services:
    image: ghcr.io/jeffu231/amateurradioservices:latest
    container_name: amateur-radio-api
    restart: unless-stopped
    networks:
      - traefik-net
    environment:
      - Qrz__Username=${QrzUsername}
      - Qrz__Password=${QrzPassword}
      - Aprs__ApiKey=${AprsApiKey}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.amateur-radio-utilities-api.rule=Host(`$HOSTNAME`) && (PathPrefix(`/api/ars/`))"
      - "traefik.http.routers.amateur-radio-utilities-api.service=amateur-radio-api"
      - "traefik.http.services.amateur-radio-api.loadbalancer.server.port=8080"
      - "traefik.http.services.amateur-radio-api.loadbalancer.healthcheck.path=/health/ready"
      - "traefik.http.services.amateur-radio-api.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.amateur-radio-api.loadbalancer.healthcheck.timeout=5s"

networks:
  traefik-net:
    external: true
   
